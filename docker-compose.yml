# Service-Block für die ki-video-diagrams Web-UI.
#
# Kann so als eigenständige Compose-Datei laufen ODER der `services:`-Eintrag
# in eine bestehende Compose-Struktur (z. B. apps-prod) übernommen werden.
#
# Öffentliche Erreichbarkeit läuft über Caddy, nicht über dieses Port-Mapping:
#   * Der Container-Port bleibt bewusst nur auf 127.0.0.1 des Hosts gemappt
#     (nie "5173:5173" oder "0.0.0.0:5173:5173" — der Container selbst ist
#     also nie direkt aus dem Internet erreichbar).
#   * Caddy läuft daneben (selber Host bzw. selber apps-prod-Stack), terminiert
#     TLS auf der echten Domain und proxied auf 127.0.0.1:5173.
# Grund für die Vorsicht: Die Web-UI startet claude mit
# --dangerously-skip-permissions — jeder Prompt, der durchs Passwort (siehe
# src/auth.mjs) kommt, kann beliebige Befehle im Container ausführen. Details
# und Mitigationen (Rate-Limiting, starkes Passwort) siehe README, Abschnitt
# "Sicherheit".

services:
  ki-video-diagrams:
    build:
      context: .
    image: ki-video-diagrams
    container_name: ki-video-diagrams
    # Secrets (CLAUDE_CODE_OAUTH_TOKEN, APP_PASSWORD, SESSION_SECRET) und
    # PORT aus der Server-.env.
    env_file: .env
    # Nur an das Loopback des Hosts binden — Caddy proxied genau hierhin.
    # NIEMALS "5173:5173" oder "0.0.0.0:5173:5173" daraus machen.
    ports:
      - "127.0.0.1:5173:5173"
    # Erzeugte Diagramme in einem benannten Volume, damit sie Neustarts
    # überleben (die Web-UI liefert sie über die Download-Links aus).
    volumes:
      - ki-video-output:/app/output
    restart: unless-stopped

volumes:
  ki-video-output:
