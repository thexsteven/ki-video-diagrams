<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KI-Video-Diagramme</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Diagramm erstellen</h1>
      <p class="lead">
        Beschreib dein Konzept — Claude Code erzeugt daraus ein
        <code>.excalidraw</code>, das du danach in Excalidraw feinjustieren kannst.
      </p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="free" role="tab" aria-selected="true">
          Freier Prompt
        </button>
        <button type="button" class="tab" data-tab="wizard" role="tab" aria-selected="false">
          Fragen-Dialog
        </button>
      </div>

      <form id="free-form" class="panel" data-panel="free">
        <label for="free-prompt">Konzeptbeschreibung</label>
        <textarea
          id="free-prompt"
          name="prompt"
          rows="6"
          required
          placeholder="z.B. Ein AI Harness: das LLM in der Mitte, drumherum System-Prompt, Tools, Memory und der Kontroll-Loop."
        ></textarea>
        <button type="submit" class="primary">Diagramm erstellen</button>
      </form>

      <form id="wizard-form" class="panel hidden" data-panel="wizard">
        <label for="w-topic">Thema *</label>
        <input id="w-topic" name="topic" type="text" required placeholder="z.B. AI Harness" />

        <label for="w-audience">Zielgruppe</label>
        <input id="w-audience" name="audience" type="text" placeholder="z.B. Zuschauer ohne Vorwissen" />

        <span class="label">Tiefe</span>
        <div class="chip-group" data-name="depth">
          <button type="button" class="chip active" data-value="einfach">Einfach</button>
          <button type="button" class="chip" data-value="technisch">Technisch / umfassend</button>
        </div>
        <input type="hidden" name="depth" value="einfach" />

        <label for="w-components">Kernkomponenten / Schritte</label>
        <textarea
          id="w-components"
          name="components"
          rows="4"
          placeholder="z.B. LLM, System-Prompt, Tools, Memory, Kontroll-Loop"
        ></textarea>

        <label for="w-patterns">Gewünschte visuelle Patterns (optional)</label>
        <input id="w-patterns" name="patterns" type="text" placeholder="z.B. Hub-and-Spoke, Zyklus" />

        <button type="submit" class="primary">Diagramm erstellen</button>
      </form>

      <section id="status" class="status hidden" aria-live="polite">
        <div id="status-running" class="hidden">
          <div class="spinner" aria-hidden="true"></div>
          <p id="status-text">Claude Code arbeitet …</p>
        </div>

        <div id="status-error" class="hidden">
          <p class="error-text" id="error-text"></p>
          <button type="button" class="secondary" id="retry-button">Neu versuchen</button>
        </div>

        <div id="status-done" class="hidden">
          <img id="result-png" alt="Erzeugtes Diagramm" />
          <a id="download-link" class="primary download" download>.excalidraw herunterladen</a>
          <button type="button" class="secondary" id="new-button">Neues Diagramm</button>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
